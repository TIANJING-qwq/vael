name: Build & Release

# 打 tag（v*）时自动：三平台构建 -> 打包 -> 上传到 GitHub Release
# 优点：runner 走 GitHub 内网，上传比本地快很多
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        rid: [win-x64, linux-x64, osx-arm64, osx-x64]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Publish (${{ matrix.rid }})
        run: |
          dotnet publish -c Release -r ${{ matrix.rid }} --self-contained false \
            -o publish/${{ matrix.rid }}

      - name: Copy LibVLC native (win-x64)
        if: matrix.rid == 'win-x64'
        run: |
          VLC="$HOME/.nuget/packages/videolan.libvlc.windows/3.0.21/build/x64"
          if [ -d "$VLC" ]; then cp -r "$VLC"/* publish/${{ matrix.rid }}/; fi

      - name: Zip
        run: |
          cd publish/${{ matrix.rid }}
          zip -r ../Vael_${{ matrix.rid }}_${{ github.ref_name }}.zip .

      - uses: actions/upload-artifact@v4
        with:
          name: Vael-${{ matrix.rid }}
          path: publish/Vael_*.zip
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: 'Vael-*'
          merge-multiple: true

      - name: List artifacts
        run: ls -lh artifacts

      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*.zip
          generate_release_notes: true